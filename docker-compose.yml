name: ai-testing

networks:
  ai-net:
    name: ai-testing-net
    driver: bridge

volumes:
  backend-data:
    name: ai-testing-backend-data
  backend-logs:
    name: ai-testing-backend-logs

services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    image: ai-testing:latest
    container_name: ai-testing
    restart: unless-stopped

    # Secrets (LLM API keys) live in .env at the repo root. Optional: every
    # variable has a default; missing keys are reported by the app at runtime.
    env_file:
      - path: .env
        required: false

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}

    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

    networks:
      - ai-net

    ports:
      # Backend listens on 127.0.0.1:18000 inside the container and is reached
      # only through the Next rewrite (/api/*), so 3000 is the only public port.
      - "${FRONTEND_PORT:-3000}:3000"
