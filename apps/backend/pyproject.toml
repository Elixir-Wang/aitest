[project]
name = "ai-testing-backend"
version = "0.1.0"
description = "FastAPI backend for the AI testing system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==48.0.0",
    "ddddocr>=1.6.1",
    "deepagents>=0.6.7",
    "email-validator==2.3.0",
    "fastapi==0.124.2",
    "httptools>=0.8.0",
    "httpx==0.28.1",
    "langchain>=1.3.13",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.3.5",
    "locust==2.45.0",
    "loguru==0.7.3",
    "pydantic==2.12.5",
    "pymupdf==1.26.7",
    "pytest>=9.0.1",
    "pytest-json-report>=1.5.0",
    "pytest-playwright>=0.7.0",
    "pyyaml>=6.0.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.20",
    "requests==2.34.2",
    "uvicorn==0.50.2",
    "websocket-client>=1.9.0",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.1",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
