[project]
name = "ai-testing-backend"
version = "0.1.0"
description = "FastAPI backend for the AI testing system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==48.0.0",
    "ddddocr>=1.6.1",
    "deepagents>=0.6.7",
    "email-validator==2.3.0",
    "fastapi==0.124.2",
    "httpx==0.28.1",
    "langchain>=1.0.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.0.0",
    "loguru==0.7.3",
    "openai-agents==0.17.3",
    "pydantic==2.12.5",
    "pymupdf==1.26.7",
    "pytest>=9.0.1",
    "python-docx==1.2.0",
    "python-multipart==0.0.20",
    "requests==2.34.2",
    "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.1",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
