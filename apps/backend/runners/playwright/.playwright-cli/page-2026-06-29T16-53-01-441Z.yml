          - generic [ref=e380]:
            - heading "一、个人版账号" [level=2] [ref=e381]
            - heading "1.1 空间介绍" [level=3] [ref=e382]
            - paragraph [ref=e383]: 每位用户注册后，系统会自动创建一个专属空间，用户创建的智能体、知识库、数据库等资源均归属于当前空间。用户可通过导航栏进入空间管理页面，对空间成员及空间资源进行统一管理。
            - paragraph [ref=e384]: 用户可邀请其他成员加入当前空间进行协作，并根据实际需求为成员分配不同角色及权限。同时用户也可接受其他空间的邀请，进入他人的空间协同使用智能体与资源资源，实现跨成员协作。
            - paragraph [ref=e385]: 作为空间所有者，用户还可对空间成员进行移除、权限调整、空间转让及删除空间等管理操作。其中，删除空间后，空间内的智能体、知识库及相关数据将被永久清除，请谨慎操作。
            - paragraph [ref=e386]: 此外，您既能邀请他人加入自己的空间共享智能体，也能接受他人邀请，在其空间中使用对方创建的智能体，实现灵活协作。
            - heading "1.2 空间成员角色" [level=3] [ref=e387]
            - table [ref=e388]:
              - rowgroup [ref=e389]:
                - row "角色 核心权限 权限范围" [ref=e390]:
                  - columnheader "角色" [ref=e391]
                  - columnheader "核心权限" [ref=e392]
                  - columnheader "权限范围" [ref=e393]
              - rowgroup [ref=e394]:
                - row "空间所有者 1.管理所有成员（邀请、变更角色、分配权限、移除） 2.配置所有智能体的权限 3.转让、删除整个空间 空间最高权限，拥有空间的完整管理控制权，可管理所有角色权限，执行空间的核心操作" [ref=e395]:
                  - cell "空间所有者" [ref=e396]
                  - cell "1.管理所有成员（邀请、变更角色、分配权限、移除） 2.配置所有智能体的权限 3.转让、删除整个空间" [ref=e397]:
                    - text: 1.管理所有成员（邀请、变更角色、分配权限、移除）
                    - text: 2.配置所有智能体的权限
