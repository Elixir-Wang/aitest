            - heading "2.3 空间成员管理操作" [level=3] [ref=e523]
            - paragraph [ref=e524]: 在空间成员设置页面中，空间管理员可对当前空间成员进行统一管理，包括邀请成员加入空间、调整成员角色及权限，以及移除空间成员等操作。
            - paragraph [ref=e525]: 通过成员管理功能，可实现空间内智能体、知识库及其他资源的协同使用与权限控制，满足团队协作与资源管理需求。
            - heading "邀请成员" [level=4] [ref=e526]
            - list [ref=e527]:
              - listitem [ref=e528]:
                - paragraph [ref=e529]: 进入【空间管理】页面；
              - listitem [ref=e530]:
                - paragraph [ref=e531]: 点击【邀请成员】按钮；
                - paragraph [ref=e532]
              - listitem [ref=e533]:
                - paragraph [ref=e534]: 输入目标用户用户名选择成员后，为其设定角色，随后点击【确认】完成邀请。
            - paragraph [ref=e535]
            - heading "权限变更" [level=4] [ref=e536]
            - list [ref=e537]:
              - listitem [ref=e538]:
                - paragraph [ref=e539]: 进入空间管理页，在空间成员列表中找到要操作的成员；
                - paragraph [ref=e540]
              - listitem [ref=e541]:
                - paragraph [ref=e542]: 点击成员按钮，重新选择成员角色，确定即可生效。
            - paragraph [ref=e543]
            - heading "删除成员" [level=4] [ref=e544]
            - list [ref=e545]:
              - listitem [ref=e546]:
                - paragraph [ref=e547]: 若需取消成员的空间访问权限，进入空间管理页，在【空间成员设置】成员列表中找到对应人员；
              - listitem [ref=e548]:
                - paragraph [ref=e549]: 点击【删除成员】即可，删除后对方将无法再访问该空间及内部所有资源。
            - paragraph [ref=e550]
            - heading "2.4 智能体权限配置" [level=3] [ref=e551]
            - paragraph [ref=e552]: 除空间级权限外，系统还支持对单个智能体进行独立权限配置。空间管理员可根据实际协作需求，为不同成员分配对应智能体的使用、编辑及管理权限，实现更精细化的权限控制。
            - paragraph [ref=e553]: 通过智能体权限配置，可有效控制成员对指定智能体的访问范围，保障空间内不同业务、不同角色之间的资源使用安全与协作管理规范。
            - heading "权限分类" [level=4] [ref=e554]
