                - row "空间成员 1.仅拥有所有者、管理者分配的基础权限(智能体的管理查看权限以及知识库的访问和操作权限 基础访问权限、可操作的功能与内容完全由空间所有者或管理者分配的权限决定" [ref=e403]:
                  - cell "空间成员" [ref=e404]
                  - cell "1.仅拥有所有者、管理者分配的基础权限(智能体的管理查看权限以及知识库的访问和操作权限" [ref=e405]
                  - cell "基础访问权限、可操作的功能与内容完全由空间所有者或管理者分配的权限决定" [ref=e406]
            - heading "1.3 空间成员管理操作" [level=3] [ref=e407]
            - paragraph [ref=e408]: 在空间成员设置页面中，空间所有者、空间管理者可对当前空间成员进行统一管理，包括邀请成员加入空间、调整成员角色及权限，以及移除空间成员等操作。
            - paragraph [ref=e409]: 通过成员管理功能，可实现空间内智能体、知识库及其他资源的协同使用与权限控制，满足团队协作与资源管理需求。
            - heading "邀请成员" [level=4] [ref=e410]
            - paragraph [ref=e411]: 支持通过邀请链接邀请其他用户加入当前空间，实现跨成员协作与资源共享。
            - paragraph [ref=e412]
            - paragraph [ref=e413]: 空间管理者可在成员管理页面生成邀请链接，并根据协作需求为被邀请成员分配不同角色。支持以下两种邀请方式：
            - list [ref=e414]:
              - listitem [ref=e415]:
                - paragraph [ref=e416]:
                  - text: 成为空间管理者
                  - text: 被邀请成员加入后，将拥有空间管理、成员管理及部分资源管理权限；
              - listitem [ref=e417]:
                - paragraph [ref=e418]:
                  - text: 成为空间成员
                  - text: 被邀请成员加入后，可根据权限使用当前空间内的智能体及资源，但不具备空间管理权限。
            - paragraph [ref=e419]: 生成邀请链接时，还可设置链接有效期，支持以下时长：
            - list [ref=e420]:
              - listitem [ref=e421]:
                - paragraph [ref=e422]: 24 小时
              - listitem [ref=e423]:
                - paragraph [ref=e424]: 7 天
              - listitem [ref=e425]:
                - paragraph [ref=e426]: 14 天
              - listitem [ref=e427]:
                - paragraph [ref=e428]: 30 天
            - paragraph [ref=e429]: 配置完成后，点击【复制链接】即可生成对应邀请链接，并分享给需要加入空间的用户。
            - paragraph [ref=e430]
            - paragraph [ref=e431]: 接受他人的空间邀请后，即可进入对方的空间。在对方空间中，可根据被分配的角色和权限，使用对方创建的智能体，无需重复搭建，高效协同工作。
            - heading "权限变更" [level=4] [ref=e432]
            - paragraph [ref=e433]: 空间管理员与空间所有者可对成员进行权限变更，具体包括智能体权限变更和知识库权限变更，相关功能将在 1.4智能体权限配置 和 1.5章节知识库权限配置 中详细说明。
            - paragraph [ref=e434]
            - heading "删除成员" [level=4] [ref=e435]
            - paragraph [ref=e436]: 当角色为空间所有者或空间管理员时，可进行【删除成员】操作：
            - list [ref=e437]:
              - listitem [ref=e438]:
                - paragraph [ref=e439]: 进入空间管理页，在【空间成员设置】成员列表中找到对应人员；
              - listitem [ref=e440]:
                - paragraph [ref=e441]: 点击【删除成员】即可，删除后对方将无法再访问该空间及内部所有资源。
            - paragraph [ref=e442]
            - heading "1.4 智能体权限配置" [level=3] [ref=e443]
            - heading "权限分类" [level=4] [ref=e444]
            - table [ref=e445]:
              - rowgroup [ref=e446]:
                - row "权限类别 权限说明" [ref=e447]:
                  - columnheader "权限类别" [ref=e448]
                  - columnheader "权限说明" [ref=e449]
              - rowgroup [ref=e450]:
                - row "全部可管理 默认专属资源和空间资源均拥有完整的管理权限" [ref=e451]:
                  - cell "全部可管理" [ref=e452]
                  - cell "默认专属资源和空间资源均拥有完整的管理权限" [ref=e453]
                - row "部分可管理 默认专属资源拥有完整管理权限，对空间资源仅可查看。可进行成员权限变更操作" [ref=e454]:
                  - cell "部分可管理" [ref=e455]
                  - cell "默认专属资源拥有完整管理权限，对空间资源仅可查看。可进行成员权限变更操作" [ref=e456]
                - row "仅可查看 默认专属资源和空间资源仅能查看内容详情，不支持任何编辑、删除或权限修改操作" [ref=e457]:
                  - cell "仅可查看" [ref=e458]
                  - cell "默认专属资源和空间资源仅能查看内容详情，不支持任何编辑、删除或权限修改操作" [ref=e459]
            - heading "操作方式" [level=4] [ref=e460]
            - paragraph [ref=e461]: "确认需要变更的成员后，点击其右侧对应的【权限变更】,选择【智能体权限变更】:"
            - list [ref=e462]:
              - listitem [ref=e463]:
                - paragraph [ref=e464]: 若成员角色为空间管理者，默认拥有所有智能体权限，无法进行单独的智能体权限变更。
                - paragraph [ref=e465]
              - listitem [ref=e466]:
                - paragraph [ref=e467]: 若成员角色为空间成员，管理员可以逐一设置其对各个智能体的操作权限。
            - paragraph [ref=e468]
            - heading "1.5 知识库权限配置" [level=3] [ref=e469]
            - heading "权限分类" [level=4] [ref=e470]
            - paragraph [ref=e471]: 空间所有者和空间管理员拥有知识库全部权限;
            - paragraph [ref=e472]: 对于空间成员, 可为其逐一设置其对各个知识库的访问编辑权限。
            - paragraph [ref=e473]
            - heading "操作方式" [level=4] [ref=e474]
            - paragraph [ref=e475]: "确认需要变更的成员后，点击其右侧对应的【权限变更】,选择【智能体权限变更】:"
            - heading "1.6 转让空间&删除空间" [level=3] [ref=e476]
            - paragraph [ref=e477]: 作为空间所有者，可在【空间管理】-【空间设置】页面执行【转让空间】与【删除空间】操作。
            - heading "转让空间" [level=4] [ref=e478]
            - list [ref=e479]:
              - listitem [ref=e480]:
                - paragraph [ref=e481]: 在转让空间时，系统会要求您从已经加入该空间的成员中选择一位作为新的所有者；
              - listitem [ref=e482]:
                - paragraph [ref=e483]: 转让完成后，您的状态将更改为管理者，无法进行转让空间、删除空间等所有者专属操作；
              - listitem [ref=e484]:
                - paragraph [ref=e485]: 空间内已有资源与成员关系将保留不变。
            - paragraph [ref=e486]
            - paragraph [ref=e487]
            - heading "删除空间" [level=4] [ref=e488]
            - list [ref=e489]:
              - listitem [ref=e490]:
                - paragraph [ref=e491]: 删除空间后，空间内所有智能体、知识库、对话历史等数据将永久清除，无法恢复；
              - listitem [ref=e492]:
                - paragraph [ref=e493]: 请务必在删除前备份重要数据，确认无使用需求后再操作。
            - paragraph [ref=e494]
            - separator [ref=e495]
            - heading "二、企业版账号" [level=2] [ref=e496]
            - heading "2.1 空间介绍" [level=3] [ref=e497]
            - paragraph [ref=e498]: 企业版空间适用于企业内部团队协作场景。企业成员加入企业后，可实现团队级资源共享与权限协同。
            - paragraph [ref=e499]: 企业版空间支持在空间管理页面统一管理企业成员，并对智能体及资源库配置不同的使用与编辑权限，保障企业内部资源的安全与规范使用，提升团队在AI写作、知识管理及业务处理场景下的协作效率。
            - paragraph [ref=e500]: 企业版空间支持企业内部成员邀请、权限分级管理、跨空间协助等能力，便于企业根据组织架构进行统一管理与运营。
            - heading "2.2 空间成员角色" [level=3] [ref=e501]
            - paragraph [ref=e502]: 为不同成员分配对应角色及操作权限，实现企业空间内的分级管理与协同控制。
            - paragraph [ref=e503]: 不同角色对应不同的资源访问范围及管理能力，包括空间管理、成员管理、智能体编辑、资源库编辑等权限。
