                  - cell "空间最高权限，拥有空间的完整管理控制权，可管理所有角色权限，执行空间的核心操作" [ref=e398]
                - row "空间管理者 1.智能体创建、删除、管理等操作，并支持自主规划 Agent、写作 Agent、任务流 Agent 的复制，以及自主规划 Agent、写作 Agent 的导出操作 2.允许访问并使用空间内所有资源 3.邀请外部成员以空间成员身份进入空间 空间管理权限，可在所有者授权范围内管理成员的智能体与知识库权限，默认拥有完整的智能体、知识库权限" [ref=e399]:
                  - cell "空间管理者" [ref=e400]
                  - cell "1.智能体创建、删除、管理等操作，并支持自主规划 Agent、写作 Agent、任务流 Agent 的复制，以及自主规划 Agent、写作 Agent 的导出操作 2.允许访问并使用空间内所有资源 3.邀请外部成员以空间成员身份进入空间" [ref=e401]:
                    - text: 1.智能体创建、删除、管理等操作，并支持自主规划 Agent、写作 Agent、任务流 Agent 的复制，以及自主规划 Agent、写作 Agent 的导出操作
