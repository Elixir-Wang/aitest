                  - text: AI 助力业务经营与办公提效
                - list [ref=e594]:
                  - generic [ref=e595]: 1. 服务总结
                  - generic [ref=e596]:
                    - generic [ref=e597]: 根据成员与客户的服务记录，AI 能自动总结客户的需求、意向和成交卡点等服务字段，并每天推荐可重点服务的客户，助力业务增收（功能逐步打开）。
                    - list [ref=e598]:
                      - listitem [ref=e599]: 成员服务客户时，可在聊天工具栏查看服务总结，快速查看客户信息。
                      - listitem [ref=e600]: AI 每天推荐可重点服务的客户，提醒成员及时跟进。
                      - listitem [ref=e601]: 支持添加和修改 AI 服务字段，满足个性化的业务需求。
                  - generic [ref=e602]: 2. 智能助理
                  - generic [ref=e603]:
                    - generic [ref=e604]: 智能助理 · 大圆，现已开启内测。
                    - list [ref=e605]:
                      - listitem [ref=e606]: 通过手机端的贴边把手和电脑端快捷键可随时唤起大圆，自然衔接当前功能和上下文，辅助你更高效使用各项功能。
                      - listitem [ref=e607]: 大圆能帮你总结聊天内容、读写文档表格、汇总项目进展，也支持设置定时任务，自动整理工作待办、联网搜索行业动态。
                  - generic [ref=e608]: 3. 智能表格
                  - list [ref=e610]:
                    - listitem [ref=e611]: AI 字段支持解析文件、处理图片。
                    - list [ref=e612]:
                      - listitem [ref=e613]: 解析文件：可帮你从文件中提取合同到期日、发票金额、候选人学历等信息。
                      - listitem [ref=e614]: 处理图片：可帮你添加图片水印、移除图片背景、提升清晰度、生成二维码。
                  - generic [ref=e615]: 4. 智能文档
                  - list [ref=e617]:
                    - listitem [ref=e618]: 新增目录功能，阅读长篇内容更高效。同时支持划词评论，可选中文档任意内容进行评论。
                    - listitem [ref=e619]: 支持更丰富的内容块。可添加流程图和思维导图，用图呈现复杂步骤和思路。链接可展示为带标题和封面图的卡片样式，适用于搭建知识库目录或资料导航。
                  - generic [ref=e620]: 5. 记录面聊
                  - list [ref=e622]:
                    - listitem [ref=e623]: 记录面聊入口更丰富快捷：可在日程开始时，提醒我开始记录面聊；也可在手机屏幕上添加记录面聊的小组件、快捷指令，或添加录音设备，快速启动记录。
                    - listitem [ref=e624]: 支持从工作台打开记录面聊，找回历史面聊。也支持了关键词查找面聊内容。
