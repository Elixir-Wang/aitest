                - list [ref=e628]:
                  - generic [ref=e629]: 1. 聊天和基础体验
                  - list [ref=e631]:
                    - listitem [ref=e632]: 新增分支回复，适用于在项目大群、部门群中，部分成员针对一件事情展开讨论。无需再新建小群或重复私聊。
                    - listitem [ref=e633]: 分支回复不会通知未参与的群成员，减少打扰。所有群成员都能按需查看内容。转发后也能聚合展示。
                    - listitem [ref=e634]: 贴表情新增 3 个表情，表达更丰富。
                    - listitem [ref=e635]: 搜索可以找到收藏、存储空间等功能了。当单聊、群聊中@的成员账号暂不可用时，可以看到提示“对方无法收发消息”，避免无效等待。
