- generic [active] [ref=e1]:
  - generic [ref=e4]:
    - paragraph [ref=e5]: 百融百工隐私政策
    - paragraph
    - paragraph [ref=e6]: 生效日期：2025年04月17日
    - paragraph
    - paragraph [ref=e7]: 欢迎您使用百融百工服务！百融至信（北京）科技有限公司（简称“我们”）深知个人信息对您的重要性，您的信赖对我们非常重要，我们将严格遵守法律法规要求采取相应的安全保护措施、保护您的个人信息安全性。基于此，我们制定本《百融百工隐私政策》（简称“本政策”），帮助您充分了解在您参与使用本服务的过程中，我们会如何收集、使用、共享、存储和保护您的个人信息以及您可以如何管理您的个人信息，以便您更好地作出适当的选择。
    - paragraph
    - paragraph [ref=e8]: 在正式开启本服务前，请您务必先仔细阅读和理解本政策，特别应重点阅读我们以粗体/粗体下划线标识的条款，确保您充分理解和同意之后再开始使用。除本政策外，在特定场景下，我们还会通过即时告知（含弹窗、页面提示等）、功能更新说明等方式，向您说明对应的信息收集目的、范围及使用方式，这些即时告知及功能更新说明等构成本政策的一部分，并与本政策具有同等效力。本政策中涉及的专业词汇，我们尽量以简明通俗的表述向您解释，以便于您理解。如对本政策内容有任何疑问、意见或建议，您可通过本政策文末的联系方式与我们联系。
    - paragraph
    - paragraph [ref=e9]: 本政策将帮助您了解以下内容：
    - paragraph
    - paragraph [ref=e10]: 一、本政策的适用范围
    - paragraph
    - paragraph [ref=e11]: 二、我们如何收集和使用您的个人信息
    - paragraph
    - paragraph [ref=e12]: 三、我们如何使用Cookie和同类技术
    - paragraph
    - paragraph [ref=e13]: 四、我们如何共享、转让、公开披露您的个人信息
    - paragraph
    - paragraph [ref=e14]: 五、您如何管理您的个人信息
    - paragraph
    - paragraph [ref=e15]: 六、我们如何保护和保存您的个人信息
    - paragraph
    - paragraph [ref=e16]: 七、未成年人用户信息的特别约定
    - paragraph
    - paragraph [ref=e17]: 八、本政策的更新
    - paragraph
    - paragraph [ref=e18]: 九、如何联系我们
    - paragraph
    - paragraph [ref=e19]: 十、其他
    - paragraph
    - paragraph [ref=e20]: 一、本政策的适用范围
    - paragraph
    - paragraph [ref=e21]: 1.1. 本政策适用于百融百工应用系统（统称“百融百工应用”）向您提供的各项产品和服务。若我们向您提供的产品或服务内设有单独隐私政策或类似法律文件，该等单独的文件优先适用。
    - paragraph
    - paragraph [ref=e22]: 1.2. 本政策不适用于其他第三方向您提供的服务，您的信息处理及保护事宜应当适用该等第三方的隐私权政策或类似文件，我们对任何第三方不当使用或披露由您提供的信息不承担任何法律责任。
    - paragraph
    - paragraph [ref=e23]: 二、我们如何收集和使用您的个人信息
    - paragraph
    - paragraph [ref=e24]: 在您使用本服务期间，我们可能通过以下两种方式获取您的信息：
    - paragraph
    - paragraph [ref=e25]: （1）您在使用本服务期间主动向我们提供的信息，如您在注册账号过程中填写的相应信息；
    - paragraph
    - paragraph [ref=e26]: （2）在您使用本服务期间，我们主动收集的相关信息，如在您使用百融百工应用的操作记录或其他日志类数据等。
    - paragraph
    - paragraph [ref=e27]: 在您使用本服务期间，我们需要/可能需要收集和使用的您的个人信息包括如下两种：
    - paragraph
    - paragraph [ref=e28]: （1）为实现向您提供百融百工应用的基本功能或服务，您须授权我们收集、使用的必要的信息。如您拒绝提供相应信息，您将无法正常使用本服务。
    - paragraph
    - paragraph [ref=e29]: （2）为实现向您提供百融百工应用的附加功能或服务，您可选择单独同意或不同意我们收集、使用的信息。如您拒绝提供，您将无法正常使用相关附加功能或无法达到我们拟达到的功能效果，但不会影响您正常使用本服务的基本功能。
    - paragraph
    - paragraph [ref=e30]: （一）为向您提供百融百工应用的基本功能或服务
    - paragraph
    - paragraph [ref=e31]: 2.1. 帮助您完成账号注册
    - paragraph
    - paragraph [ref=e32]: 为帮助您完成账号注册，您需要向我们提供您的手机号码、短信验证码、邮箱地址、邮箱验证码。如果您拒绝提供上述信息，您将无法注册百融百工应用账号，进而无法正常使用本服务。
    - paragraph
    - paragraph [ref=e33]: 2.2. 为您提供人机交互对话
    - paragraph
    - paragraph [ref=e34]: 2.2.1. 信息范围：本服务的对话应用依赖于您输入的内容，即我们需要收集并记录您与百融百工应用对话时所输入的文本、语音、图片等信息，并为您提供智能对话服务。同时，为便于您随时能查看及管理对话历史记录，我们会记录您与百融百工应用的对话记录，包括您输入的文本对话信息、以及基于上述信息形成的对话主题。
    - paragraph
    - paragraph [ref=e35]: 2.2.2. 百融百工应用致力于为您提供更为优质的服务，在对输入内容进行去标识化处理且确保无法重新识别特定个人的前提下，我们会使用您向百融百工人工智能模型输入的数据、发出的指令以及人工智能模型相应生成的回复、您对产品的访问和使用情况进行分析和用于模型训练，以提高对话质量和响应速度、以及对用户输入内容的理解能力。
    - paragraph
    - paragraph [ref=e36]: 2.2.3. 如您选择以语音的方式进行交互，我们会申请开启您的麦克风权限，以收集您的语音信息（包括语音转文本信息）以向您提供服务。
    - paragraph
    - paragraph [ref=e37]: 2.2.4如您的输入信息、提交的信息反馈以及其他您向我们提供的信息中可能包含他人的个人信息，请您务必在提供前取得他人的合法授权，避免造成他人个人信息的不当泄露。
    - paragraph
    - paragraph [ref=e38]: 2.3. 为保证本服务稳定开展
    - paragraph
    - paragraph [ref=e39]: 2.3.1. 为保证本服务正常开展，我们可能会收集您在使用本服务过程中产生的日志信息（包括您的浏览器信息和类型、您提出请求的日期和时间，以及您如何与我们的网站互动）、使用信息（例如客户端日期和访问时间、服务端日期和访问时间、计算机或移动设备的类型、网络信息）、Cookie等来帮助我们进行服务情况分析，并进一步帮助我们能有效地增强您的使用体验。我们承诺，不会将Cookie用于本政策所述目的之外的任何其他用途。我们使用Cookie主要为了保障服务体验的安全、高效运转，可以使我们确认您账号的安全状态，排查崩溃、延迟的相关异常情况，帮助您省去重复填写表单、输入搜索内容的步骤和流程。
    - paragraph
    - paragraph [ref=e40]: 2.3.2. 为提高本服务安全性，保护您或其他用户或公众的人身安全、财产安全、账号安全，更好地预防钓鱼网站、欺诈、网络漏洞、计算机病毒、网络攻击、网络侵入、恶意程序等安全风险，更准确地识别违反法律法规或相关协议、规则的情况，我们会收集您的日志信息，并可能使用或整合您的日志信息，来综合判断您账号及使用风险，防范安全事件，并依法采取必要的记录、审计、分析、处置措施。
    - paragraph
    - paragraph [ref=e41]: （二）为向您提供百融百工应用的附加功能或服务
    - paragraph
    - paragraph [ref=e42]: 2.4. 为您提供意见反馈渠道
    - paragraph
    - paragraph [ref=e43]: 2.4.1 在应用服务过程中，您可以根据实际情况对百融百工应用的回复做出评价，包括点赞、点踩等。在经过去标识化且无法重新识别特定个人的前提下，我们将收集您的反馈，以优化服务体验。如您拒绝向我们提供前述信息，可能无法享受我们向您提供的附加服务，但您仍可正常使用本服务的基本功能。
    - paragraph [ref=e44]: 2.4.2 在应用服务过程中，您也可以通过“问题反馈”模块反馈意见。您可以点击左下角“账户”图标，点击“意见反馈”后进行反馈。
    - paragraph [ref=e45]: 当您使用“意见反馈”反馈意见时，您需要提交问题与反馈内容、联系方式（邮箱/手机号），以便我们快速排查并及时响应您的反馈。
    - paragraph
    - paragraph [ref=e46]: （三）无需获得您授权同意的个人信息收集、使用例外情形
    - paragraph
    - paragraph [ref=e47]: 2.5. 您充分知晓，依据可适用的法律，在以下情形中，我们收集、使用您的个人信息无需征得您的授权同意：
    - paragraph
    - paragraph [ref=e48]: 2.5.1. 涉及国家安全与利益、社会公共利益的；
    - paragraph
    - paragraph [ref=e49]: 2.5.2. 为履行我们的法定职责或者法定义务或者响应政府部门指示所必需的；
    - paragraph
    - paragraph [ref=e50]: 2.5.3. 与您签订和履行您作为协议或其他书面文件一方所必需的；
    - paragraph
    - paragraph [ref=e51]: 2.5.4. 为应对突发公共卫生事件，或者紧急情况下为保护您和他人的生命健康和财产安全所必需；
    - paragraph
    - paragraph [ref=e52]: 2.5.5. 在合理的范围内处理您自行向社会公众公开的个人信息；
    - paragraph
    - paragraph [ref=e53]: 2.5.6. 在合理的范围内处理从合法公开披露的信息中收集的您的个人信息（如合法的新闻报道、政府信息公开等渠道）；
    - paragraph
    - paragraph [ref=e54]: 2.5.7. 法律法规规定的其他情形。
    - paragraph
    - paragraph [ref=e55]: 2.6. 如您拒绝我们收集和处理前述信息，请您谨慎输入文本信息。如您输入的内容（包括但不限于对话信息、反馈）涉及第三方的信息（包括但不限于个人信息），在输入这些信息之前，您需确保您已经取得合法的授权，避免泄露他人个人信息，侵犯他人权利。
    - paragraph
    - paragraph [ref=e56]: 2.7. 请您理解，我们向您提供的功能和服务是不断更新和发展的，如果某一功能或服务未被包含在上述说明中且收集了您的信息，我们会通过页面提示、交互流程、网站公告、另行签署协议等方式另行向您说明信息收集的目的、方式和种类，以征得您的同意。
    - paragraph
    - paragraph [ref=e57]: 三、我们如何使用Cookie和同类技术
    - paragraph
    - paragraph [ref=e58]: 1.Cookie技术的使用
    - paragraph
    - paragraph [ref=e59]: 我们会通过cookies收集和使用您的信息，并将该等信息储存为日志信息。我们使用自己的cookies，目的是为您提供更优质的用户体验和服务，并用于以下用途： （1）记住您的身份。例如：cookies有助于我们辨认您作为我们的注册用户的身份 （2）分析您使用我们服务的情况。例如，我们可利用cookies来了解您使用我们的服务进行什么活动，或哪些网页或服务最受您的欢迎。 我们为上述目的使用cookies的同时，可能将通过cookies收集的非个人身份信息，经统计加工后提供给广告商或其他合作伙伴，用于分析用户如何使用我们的服务，并用于广告服务。
    - paragraph
    - paragraph [ref=e60]: 2.Cookie同类技术的使用
    - paragraph
    - paragraph [ref=e61]: 我们的产品和服务不会使用Cookie同类技术收集和使用您的个人信息。
    - paragraph
    - paragraph [ref=e62]: 请您知悉，我们的产品和服务上可能会有广告商或其他第三方服务提供商放置的cookies及同类技术。这些cookies及同类技术可能会收集与您相关的非个人身份信息，以用于分析用户如何使用该等服务、向您发送您可能感兴趣的广告，或用于评估广告服务的效果。这些第三方cookies及同类技术收集和使用该等信息，不受本政策的约束，而是受相关使用者的隐私政策约束，我们不对第三方的cookies及同类技术承担责任。
    - paragraph
    - paragraph
    - paragraph [ref=e63]: 四、我们如何共享、转让、公开披露您的个人信息
    - paragraph
    - paragraph [ref=e64]: 为了提供更好的客户服务和用户体验，我们可能会与合作伙伴进行合作，合作中我们将会遵守以下原则：（1）合法正当与最小必要原则：数据处理应当具有合法性基础，具有正当的目的，并以实现处理目的最小范围为限；（2）用户知情权与决定权最大化原则：数据处理过程中充分尊重用户对其个人信息处理享有的知情权与决定权；（3）安全保障能力最强化原则：我们将采取必要措施保障所处理个人信息的安全，审慎评估合作方使用数据的目的，对这些合作方的安全保障能力进行综合评估，并要求其遵循合作协议的有关要求。
    - paragraph
    - paragraph [ref=e65]: 4.1. 委托处理
    - paragraph
    - paragraph [ref=e66]: 我们可能委托授权合作伙伴（如技术服务方、授权合作伙伴等）处理您的个人信息，以便授权合作伙伴代表我们为您提供某些服务或履行职能。我们仅会出于本政策声明的合法、正当、必要、特定、明确的目的委托其处理您的信息，授权合作伙伴只能接触到其履行职责所需信息，且我们将会通过协议要求其不得将此信息用于其他任何超出委托范围的目的。如果授权合作伙伴将您的信息用于我们未委托的用途，其将单独征得您的同意。
    - paragraph
    - paragraph [ref=e67]: 4.2. 第三方共享
    - paragraph
    - paragraph [ref=e68]: 原则上，我们不会与其他组织和个人共享您的用户信息，但以下情况除外：
    - paragraph
    - paragraph [ref=e69]: 4.2.1. 在获取您明确同意的情况下共享：获得您的明确同意后，我们会与其他方共享您的用户信息。
    - paragraph
    - paragraph [ref=e70]: 4.2.2. 为履行法定义务所必需的共享：我们可能会根据法律法规规定、诉讼、仲裁解决需要，或按行政、司法机关依法提出的要求，对外共享您的用户信息。
    - paragraph
    - paragraph [ref=e71]: 4.2.3. 为订立、履行您作为一方当事人的合同所必需的情况下的共享。
    - paragraph
    - paragraph [ref=e72]: 4.2.4.我们的某些服务将由我们和授权合作伙伴共同提供，我们可能会与合作伙伴共享您的个人信息。我们仅会出于合法、正当、必要、特定、明确的目的共享您的个人信息。
    - paragraph
    - paragraph [ref=e73]: 4.3. 转让
    - paragraph
    - paragraph [ref=e74]: 原则上，我们不会与其他组织和个人转让您的用户信息，但在我们与其他法律主体者发生合并、收购或破产清算情形，或其他涉及合并、收购或破产清算情形时，如涉及到用户信息转让，我们会要求新的持有您用户信息的公司、组织继续受本政策的约束，否则我们将要求该公司、组织和个人重新向您征求授权同意。如涉及破产且无承接方的情形，我们将依法对数据进行删除处理。
    - paragraph
    - paragraph [ref=e75]: 4.4. 公开披露
    - paragraph
    - paragraph [ref=e76]: 我们仅会在以下情况下公开披露您的用户信息：
    - paragraph
    - paragraph [ref=e77]: 4.4.1. 获得您充分同意或基于您的主动选择，我们可能会公开披露您的用户信息；或
    - paragraph
    - paragraph [ref=e78]: 4.4.2. 为保护百融至信、用户或公众的人身财产安全免遭侵害，我们可能依据适用的法律或相关协议、规则披露关于您的用户信息。
    - paragraph
    - paragraph [ref=e79]: 4.5. 委托处理、共享、转让、公开披露个人信息时事先征得授权同意的例外
    - paragraph
    - paragraph [ref=e80]: 以下情形中，委托处理、共享、转让、公开披露您的个人信息无需事先征得您的授权同意：
    - paragraph
    - paragraph [ref=e81]: 4.5.1. 与国家安全、国防安全有关的；
    - paragraph
    - paragraph [ref=e82]: 4.5.2. 与公共安全、公共卫生、重大公共利益有关的；
    - paragraph
    - paragraph [ref=e83]: 4.5.3. 与刑事侦查、起诉、审判和判决执行等有关的；
    - paragraph
    - paragraph [ref=e84]: 4.5.4. 出于维护您或其他个人的生命、财产等重大合法权益但又很难得到本人同意的；
    - paragraph
    - paragraph [ref=e85]: 4.5.5. 您自行向社会公众公开的个人信息；
    - paragraph
    - paragraph [ref=e86]: 4.5.6. 从合法公开披露的信息中收集个人信息的，如合法的新闻报道、政府信息公开等渠道；
    - paragraph
    - paragraph [ref=e87]: 4.5.7. 为履行我们的法定职责或者法定义务或者响应政府部门指示所必需的。
    - paragraph
    - paragraph [ref=e88]: 4.5.8. 为订立、履行您作为一方当事人的合同所必需；
    - paragraph
    - paragraph [ref=e89]: 五、您如何管理您的个人信息
    - paragraph
    - paragraph [ref=e90]: 5.1. 查阅、更正和补充
    - paragraph
    - paragraph [ref=e91]: 5.1.1. 您可自行在【“个人中心”-“账号设置 ”】内查阅、更正我们收集、使用您信息的基本情况；
    - paragraph
    - paragraph [ref=e92]: 5.1.2. 为向您提供连续性、一致性的服务体验，保障服务质量，我们会记录您的对话记录，包括您的输入信息、服务生成内容等。您可在“对话历史”“历史记录”查阅对话记录。
    - paragraph
    - paragraph [ref=e93]: 5.1.3. 如无法自行操作，您可通过【本政策披露的联系方式】与我们取得联系，我们将协助您进一步完成相应操作。
    - paragraph
    - paragraph [ref=e94]: 5.2. 复制
    - paragraph
    - paragraph [ref=e95]: 您可以通过以下方式复制您的信息：
    - paragraph
    - paragraph [ref=e96]: 5.2.1. 您可自行在【“个人中心”-“账号设置”】内，复制可自行查阅的信息；您可在“对话历史”“历史记录”复制、导出对话记录。
    - paragraph
    - paragraph [ref=e97]: 5.2.2. 如无法自行操作，您可通过【本政策披露的联系方式】与我们取得联系，我们将协助您进一步完成相应操作。
    - paragraph
    - paragraph [ref=e98]: 5.3. 删除
    - paragraph
    - paragraph [ref=e99]: 5.3.1. 您可自行在【“个人中心”-“账号设置”】内，删除可自行查阅的信息；您可在“历史记录”删除对话记录。
    - paragraph
    - paragraph [ref=e100]: 5.3.2. 在以下情形中，您可以通过本政策披露的联系方式与我们联系，向我们提出删除其他信息的请求，但已进行个人信息匿名化处理或法律法规另有规定的除外：
    - paragraph
    - paragraph [ref=e101]: （1）处理目的已实现、无法实现或者为实现处理目的不再必要；
    - paragraph
    - paragraph [ref=e102]: （2）如果我们处理用户信息的行为违反法律法规；
    - paragraph
    - paragraph [ref=e103]: （3）如果我们收集、使用您的用户信息，却未征得您的明确同意；
    - paragraph
    - paragraph [ref=e104]: （4）如果我们处理个人信息的行为严重违反了与您的约定；
    - paragraph
    - paragraph [ref=e105]: （5）法律、行政法规规定的其他情形。
    - paragraph
    - paragraph [ref=e106]: 5.3.3. 当您或我们协助您删除相关信息后，因为适用的法律和安全技术限制，我们可能无法立即从备份系统中删除相应的信息，我们将安全地存储您的个人信息并限制对其的任何进一步的处理，直到备份可以清除或实现匿名化。
    - paragraph
    - paragraph [ref=e107]: 5.4. 改变或撤回授权范围
    - paragraph
    - paragraph [ref=e108]: 5.4.1. 您可自行在【“个人中心”-“账号设置”】管理权限授权状态，以改变或撤回您此前向我们做出的授权；
    - paragraph
    - paragraph [ref=e109]: 5.4.2. 您也可以通过本政策披露的联系方式与我们联系，改变或者收回您授权我们收集和处理您的个人信息的范围；
    - paragraph
    - paragraph [ref=e110]: 5.4.3. 当您撤回同意后，我们将不再处理相应的个人信息。但您撤回同意的决定，不会影响我们此前基于您的授权而开展的个人信息处理行为。
    - paragraph
    - paragraph [ref=e111]: 5.5. 响应您的上述请求
    - paragraph
    - paragraph [ref=e112]: 5.5.1. 为保障安全，您可能需要提供书面请求，或以其他方式证明您的身份。我们可能会先要求您验证自己的身份，然后再处理您的请求。
    - paragraph
    - paragraph [ref=e113]: 5.5.2.对于与您的身份不直接关联的信息、无合理理由重复申请的信息，或者需要过多技术手段（如需要开发新系统或从根本上改变现行惯例）、给他人合法权益带来风险或者不切实际的请求，我们可能会予以拒绝。
    - paragraph
    - paragraph [ref=e114]: 5.6. 如果您无法查阅、补充、更正、删除、复制您的个人信息，或改变您授权同意的范围或撤回授权、注销账号，或您需要查阅、补充、更正、删除、复制、您在使用百融百工应用时所产生的其他个人信息，或您认为我们存在任何违反法律法规或与您关于个人信息的收集或使用的约定，您可通过本政策公布的联系方式与我们联系。
    - paragraph
    - paragraph [ref=e115]: 5.7. 响应您的权利请求的例外
    - paragraph
    - paragraph [ref=e116]: 以下情形中，我们有权不响应您的上述权利请求：
    - paragraph
    - paragraph [ref=e117]: 5.7.1. 与我们履行法律法规规定的义务相关的；
    - paragraph
    - paragraph [ref=e118]: 5.7.2. 与国家安全、国防安全直接相关的；
    - paragraph
    - paragraph [ref=e119]: 5.7.3. 与公共安全、公共卫生、重大公共利益直接相关的；
    - paragraph
    - paragraph [ref=e120]: 5.7.4. 与刑事侦查、起诉、审判和执行判决等直接相关的；
    - paragraph
    - paragraph [ref=e121]: 5.7.5. 我们有充分证据表明您或其他个人信息主体存在主观恶意或滥用权利的；
    - paragraph
    - paragraph [ref=e122]: 5.7.6. 出于维护您或其他个人信息主体的生命、财产等重大合法权益，但又很难得到本人授权同意的；
    - paragraph
    - paragraph [ref=e123]: 5.7.7. 响应您或其他个人信息主体的请求将导致您或其他个人信息主体、组织的合法权益受到严重损害的；
    - paragraph
    - paragraph [ref=e124]: 5.7.8. 涉及商业秘密的。
    - paragraph
    - paragraph [ref=e125]: 六、我们如何保护和保存您的个人信息
    - paragraph
    - paragraph [ref=e126]: 6.1. 我们非常重视您的信息安全。我们努力采取各种合理的物理、电子和管理方面的安全措施来保护您的用户信息。防止用户信息遭到未经授权访问、公开披露、使用、修改、损坏或丢失。例如，我们会使用加密技术提高用户信息的安全性；我们会使用受信赖的保护机制防止用户信息遭到恶意攻击；我们会部署访问控制机制，尽力确保只有授权人员才可访问用户信息；以及我们会举办安全和隐私保护培训课程，加强员工对于保护用户信息重要性的认识。
    - paragraph
    - paragraph [ref=e127]: 6.2. 我们会采取合理可行的措施，尽力避免收集无关的用户信息。我们只会在达成本政策所述目的所需的期限内保留您的用户信息，除非受到法律的允许。超出上述用户信息保存期限后，我们会对您的个人信息进行删除或匿名化处理。
    - paragraph
    - paragraph [ref=e128]: 6.3. 尽管我们已经按照相关法律法规要求采取了合理有效的安全措施，但由于技术限制和可能存在的恶意手段，我们不能保证百分之百的信息安全。请您了解并理解，我们所提供的系统和通信网络可能会受到我们无法控制的因素影响而出现问题。因此，我们强烈建议您采取积极措施来保护个人信息的安全，例如使用复杂密码、定期更改密码、不将账号密码和相关个人信息透露给他人等。
    - paragraph
    - paragraph [ref=e129]: 6.4. 在不幸发生用户信息安全事件（泄露、丢失等）后，我们将按照法律法规的要求，及时向您告知：安全事件的基本情况和可能的影响、我们已采取或将要采取的处置措施、您可自主防范和降低风险的建议、对您的补救措施等。我们将及时将事件相关情况以邮件、信函、电话、推送通知等方式告知您，难以逐一告知用户信息主体时，我们会采取合理、有效的方式发布公告。同时，我们还将按照监管部门要求，上报用户信息安全事件的处置情况。
    - paragraph
    - paragraph [ref=e130]: 6.5. 如出现产品和服务停止运营的情形，我们会采取合理措施保护您用户信息安全，包括及时停止继续收集用户信息的活动；停止运营的通知将以逐一送达或公告的形式通知用户；并对所持有的个人信息进行删除或匿名化处理等。
    - paragraph
    - paragraph [ref=e131]: 6.6. 原则上，我们在中华人民共和国境内收集产生的个人信息，会存储在中华人民共和国境内，不会进行跨境传输。如因业务等需要，确需向境外提供您的个人信息的，我们会向您告知境外接收方的名称或者姓名、联系方式、处理目的、处理方式、个人信息的种类以及您向境外接收方行使本法规定权利的方式和程序等事项，并在获得您的单独同意和法律法规规定的跨境提供应具备的条件后，才会将您的个人信息转移到您使用产品与/或服务所在国家/地区的境外管辖区，或者使您的个人信息受到来自这些管辖区的访问。
    - paragraph
    - paragraph [ref=e132]: 请您知悉，此类管辖区可能设有不同的个人信息保护相关法律法规，我们会遵守管辖区内相关法律法规的要求确保您的个人信息得到充分保护。如此类管辖区未设立个人信息保护相关的法律法规，我们会尽力保障您的个人信息得到在中华人民共和国境内足够同等的保护。
    - paragraph
    - paragraph [ref=e133]: 6.7 存储信息的期限
    - paragraph
    - paragraph [ref=e134]: 一般而言，我们将在您使用百融百工应用期间为实现本政策所述处理目的所必需的时间内保留您的个人信息，除非可适用的法律法规或国家规范性文件另有规定。
    - paragraph
    - paragraph [ref=e135]: 在您主动要求删除您的个人信息或注销您的账号后，我们将根据适用法律法规的要求尽快删除您的个人信息，除非可适用的法律法规或国家规范性文件要求在更长的期间内保留这些信息。但在下列情况下，我们因需符合法律要求，更改个人信息的存储时间：
    - paragraph
    - paragraph [ref=e136]: • 为遵守适用的法律法规等有关规定；
    - paragraph
    - paragraph [ref=e137]: • 为遵守法院判决、裁定或其他法律程序的规定；
    - paragraph
    - paragraph [ref=e138]: • 为遵守相关政府机关或法定授权组织的要求；
    - paragraph
    - paragraph [ref=e139]: • 我们有理由确信需要遵守法律法规等有关规定；
    - paragraph
    - paragraph [ref=e140]: • 为执行相关服务协议或本政策、维护社会公共利益，为保护客户、百融至信、其他用户或雇员的人身财产安全或其他合法权益所合理必需的用途。
    - paragraph
    - paragraph [ref=e141]: 在您终止使用百融百工应用后，我们会停止对您的信息的收集和使用，法律法规或监管部门另有规定的除外。
    - paragraph
    - paragraph [ref=e142]: 当百融百工应用的相关服务发生停止运营的情形时，我们将采取包括发送通知和公告形式通知您，并在法律法规要求的期限内删除服务器中留存的您的个人信息。
    - paragraph
    - paragraph [ref=e143]: 七、未成年人用户信息的特别约定
    - paragraph
    - paragraph [ref=e144]: 7.1. 我们仅面向成年人提供本服务，但我们非常重视对未成年人个人信息的保护。受制于现有技术和商业模式，我们很难在账号注册环节主动识别未成年人的个人信息，如果您是未成年人的监护人，且您发现我们存在未经其授权获取未成年人个人信息的情况，您可通过本政策中公示的联系方式联系我们，我们在收到通知后会及时予以核查，并在核查属实后及时删除或匿名化处理相关信息。如我们主动审查发现存在前述情形的，我们也会主动对相关个人信息予以删除或进行匿名化处理。
    - paragraph
    - paragraph [ref=e145]: 八、本政策的更新
    - paragraph
    - paragraph [ref=e146]: 8.1. 为给您带来更好的服务体验，我们持续努力改进我们的技术。我们可能会更新我们的隐私政策，并通过短信或其他适当的方式提醒您更新的内容，以便您及时了解本隐私政策的最新版本。但未经您明确同意，我们不会限制您按照本政策所享有的权利。
    - paragraph
    - paragraph [ref=e147]: 8.2. 对于重大变更，我们还会提供更为显著的通知（包括我们会通过短信、邮件进行通知或向您提供弹窗提示）再次向您告知，并根据法律法规的相关要求征得您的同意。
    - paragraph
    - paragraph [ref=e148]: 8.3. 本政策所指的重大变更包括但不限于：
    - paragraph
    - paragraph [ref=e149]: （1）我们的服务模式发生重大变化。如处理个人信息的目的、处理的个人信息的类型、个人信息的使用方式等；
    - paragraph
    - paragraph [ref=e150]: （2）我们在所有权结构、组织架构等方面发生重大变化。如业务调整、破产并购等引起的所有变更等；
    - paragraph
    - paragraph [ref=e151]: （3）个人信息共享、转让或公开披露的主要对象发生变化；
    - paragraph
    - paragraph [ref=e152]: （4）您参与个人信息处理方面的权利及其行使方式发生重大变化；
    - paragraph
    - paragraph [ref=e153]: （5）伴随政策或法律发布实施，为响应国家政策或者法律规范，做出变更。
    - paragraph
    - paragraph [ref=e154]: 九、如何联系我们
    - paragraph
    - paragraph [ref=e155]: 为更好地保护您的个人信息，我们设立有专门的网络安全与个人信息保护部门。如您在使用百融百工应用的过程中对本政策或对您的个人信息有任何疑问或建议，您可以将权利通知及支持性资料发往以下地址，我们将在收到相关资料后的15个工作日内反馈：
    - paragraph
    - paragraph [ref=e156]: （1） 中国北京市朝阳区阜荣街十号环球创意广场A座1-3层，邮编100102；
    - paragraph
    - paragraph [ref=e157]: （2） 联系电话：400-008-8182
    - paragraph
    - paragraph [ref=e158]: （3） 个人信息保护专职部门邮箱security@brgroup.com
    - paragraph
    - paragraph [ref=e159]: 如果您对我们的回复不满意，特别是您认为我们的个人信息处理行为损害了您的合法权益，且在您向我们反馈后我们无法提供让您满意的回复且拒绝改进的，您可以向相关监管机构进行投诉和举报。
    - paragraph
    - paragraph [ref=e160]: 十、其他
    - paragraph
    - paragraph [ref=e161]: 与本政策相关的任何纠纷，双方应经友好协商解决；若不能协商解决，您在此同意向百融至信住所地北京市朝阳区人民法院提起诉讼。
    - paragraph
    - paragraph [ref=e162]: 如果有管辖权的任何法院裁定或判决本政策的任何条款无效，则该条款将从本政策中移除，但该条款的无效不影响本政策其余条款的效力。本政策的其余条款将继续执行。
    - paragraph
    - paragraph [ref=e163]: 附录：相关定义
    - paragraph
    - paragraph [ref=e164]: 1. 百融百工服务：是指百融至信（北京）科技有限公司向用户提供的语言理解、知识问答、数字助理、代码理解与编写等服务，简称"本服务"。
    - paragraph
    - paragraph [ref=e165]: 2.百融至信（北京）科技有限公司：百融百工应用的经营者，专业从事智能语音及语言技术研究、软件与人工智能产品开发、语音信息服务的机构。注册地址：北京市石景山区实兴大街30号院5号楼5层76号。
    - paragraph
    - paragraph [ref=e166]: 3. 用户：是指注册、登录以及使用本应用并通过启用、浏览或上传数据至百融百工服务的用户，在本政策中更多地称为"您"。
    - paragraph
    - paragraph [ref=e167]: 4. 账号：指您完成真实信息注册后，享有的用户账号，该用户账号由您负责保管；您应当对以您账号下进行的所有行为负法律责任。
    - paragraph
    - paragraph [ref=e168]: 5.个人信息：以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息,不包括匿名化处理后的信息。
    - paragraph
    - paragraph [ref=e169]: 6.敏感个人信息：敏感个人信息是一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信息，包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息。
    - paragraph
    - paragraph [ref=e170]: 7.日志信息：包括时间、用户ID、对话ID、对话内容，以及IP地址、浏览器类型、使用语言、访问日期和时间。
    - paragraph
    - paragraph [ref=e171]: 8.去标识化：指个人信息经过处理，使其在不借助额外信息的情况下无法识别特定自然人的过程。
    - paragraph
    - paragraph [ref=e172]: 9.匿名化：指个人信息经过处理无法识别特定自然人且不能复原的过程。
    - paragraph
    - paragraph [ref=e173]: 10.Cookie：Cookie和同类设备信息标识技术是互联网中普遍使用的技术。当您体验本服务时，我们可能会使用相关技术向您的设备发送一个或多个Cookie或匿名标识符，以收集、标识和存储您访问、使用本产品时的信息。
