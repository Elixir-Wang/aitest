            - heading "配置并调试智能体" [level=1] [ref=e331]
            - paragraph [ref=e332]: 创建后需完成基础配置，其中模型和角色设定是智能体的基础。
            - heading "配置模型" [level=2] [ref=e333]
            - paragraph [ref=e334]: 基础模型是智能体的 “大脑”，决定了理解能力、响应速度和推理精度，平台提供多种模型选项，可根据功能复杂度、交互量选择适配需求的基础模型。
            - paragraph [ref=e335]
            - paragraph [ref=e336]
            - heading "角色设定" [level=2] [ref=e337]
            - paragraph [ref=e338]: 角色设定定义智能体的身份、语气和核心职责，让智能体知道 “自己是谁”“该如何与用户沟通”，避免响应偏离场景。
            - paragraph [ref=e339]:
              - text: 平台提供了大模型优化功能，方便您只输入简单的要求，就能够输入较完整的提示词。例如输入“一款语音陪伴助手”，点击大模型优化后效果如下，点击
              - strong [ref=e340]: 使用
              - text: 自动插入角色设定模块，您也可以根据您的实际需求再对提示词进行优化。
            - paragraph [ref=e341]
            - heading "为智能体添加技能（可选）" [level=1] [ref=e342]
            - paragraph [ref=e343]: 技能是智能体的 “具体能力”，如查询数据、统计分析、流程触发等，平台提供技能模板，也支持自定义开发，让智能体适配你的专属需求。
            - paragraph [ref=e344]
