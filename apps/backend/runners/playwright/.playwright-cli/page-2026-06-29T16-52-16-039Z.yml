          - generic [ref=e312]:
            - paragraph [ref=e313]: 百工平台为您提供了丰富的组件，无论您是否有代码基础，都可以在平台中快速搭建一个低代码智能体。本文将演示如何在百工平台搭建一个自主规划agent。
            - heading "创建智能体" [level=1] [ref=e314]
            - list [ref=e315]:
              - listitem [ref=e316]:
                - paragraph [ref=e317]: 如果您需要创建一个自主规划智能体，可按以下步骤进行：
              - listitem [ref=e318]:
                - paragraph [ref=e319]: 登录百融百工平台后，在左侧导航栏中单击创建智能体；
              - listitem [ref=e320]:
                - paragraph [ref=e321]: 选择自主规划Agent，输入智能体名称（必填），可选填智能体头像和智能体描述；
              - listitem [ref=e322]:
                - paragraph [ref=e323]: 选择语种（默认中文，支持英语、法语、日语等多种语言）及嵌入模型，请注意语种和嵌入模型在选择后不能更改；
              - listitem [ref=e324]:
                - paragraph [ref=e325]: 点击弹窗右下角创建，即可完成智能体创建并直接进入基础配置页面。
            - paragraph [ref=e326]
            - paragraph [ref=e327]
            - paragraph [ref=e328]
            - paragraph [ref=e329]:
