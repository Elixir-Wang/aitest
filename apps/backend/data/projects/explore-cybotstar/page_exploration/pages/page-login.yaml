page:
  id: page-login
  title: CybotStar - Login Page
  normalized_path: /login
  explored_at: '2026-06-29T16:36:22.644268Z'
  elements:
  - id: account_tab
    name: 账号登录
    role: tab
    locators:
    - kind: role
      code: 'getByRole(''generic'', { name: ''Account'' })'
      priority: 1
  - id: sms_tab
    name: 短信验证码登录
    role: tab
    locators:
    - kind: role
      code: 'getByRole(''generic'', { name: ''SMS Code'' })'
      priority: 1
  - id: email_input
    name: 邮箱账号
    role: textbox
    locators:
    - kind: role
      code: 'getByRole(''textbox'', { name: ''Email'' })'
      priority: 1
    - kind: label
      code: getByLabel('Account')
      priority: 2
  - id: password_input
    name: 密码
    role: textbox
    locators:
    - kind: role
      code: 'getByRole(''textbox'', { name: ''Enter your password'' })'
      priority: 1
    - kind: label
      code: getByLabel('Password')
      priority: 2
  - id: verification_code_input
    name: 验证码
    role: textbox
    locators:
    - kind: role
      code: 'getByRole(''textbox'', { name: ''Verification code'' })'
      priority: 1
    - kind: label
      code: getByLabel('Verification Code')
      priority: 2
  - id: password_toggle_visibility
    name: 密码可见性切换
    role: button
    locators:
    - kind: role
      code: 'getByRole(''img'').filter({ hasNot: page.getByRole(''button'') })'
      priority: 3
  - id: forgot_password_link
    name: 忘记密码
    role: link
    locators:
    - kind: text
      code: getByText('Forgot password?')
      priority: 1
  - id: login_button
    name: 登录
    role: button
    locators:
    - kind: role
      code: 'getByRole(''button'', { name: ''Log In'' })'
      priority: 1
  - id: agreement_checkbox
    name: 用户协议勾选
    role: checkbox
    locators:
    - kind: role
      code: getByRole('paragraph').first()
      priority: 2
  - id: user_agreement_link
    name: 用户协议
    role: link
    locators:
    - kind: role
      code: 'getByRole(''link'', { name: ''《User Agreement》'' })'
      priority: 1
  - id: privacy_policy_link
    name: 隐私政策
    role: link
    locators:
    - kind: role
      code: 'getByRole(''link'', { name: ''《Privacy Policy》'' })'
      priority: 1
  - id: signup_link
    name: 注册账号
    role: link
    locators:
    - kind: text
      code: getByText('Sign up')
      priority: 1
  - id: language_switcher
    name: 语言切换
    role: button
    locators:
    - kind: text
      code: getByText('English')
      priority: 1
