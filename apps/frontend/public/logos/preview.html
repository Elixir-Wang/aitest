<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Test Logo Preview</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        padding: 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 28px;
        color: #475569;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .card {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .sample {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        min-height: 112px;
      }

      .sample div {
        display: grid;
        place-items: center;
      }

      .sample img {
        width: 72px;
        height: 72px;
      }

      .soft {
        background: #f8fafc;
      }

      .white {
        background: #ffffff;
      }

      .dark {
        background: #0f172a;
      }

      .meta {
        border-top: 1px solid #e2e8f0;
        padding: 14px 16px;
      }

      .name {
        font-size: 14px;
        font-weight: 650;
      }

      .path {
        margin-top: 5px;
        color: #64748b;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>AI 测试系统 Logo 预览</h1>
    <p>这一批不使用对号、盾牌、矩阵、文档，也尽量避免横平竖直的结构。</p>
    <main class="grid">
      <section class="card">
        <div class="sample">
          <div class="soft"><img src="./ai-test-logo-lens.svg" alt="Lens logo" /></div>
          <div class="white"><img src="./ai-test-logo-lens.svg" alt="Lens logo" /></div>
          <div class="dark"><img src="./ai-test-logo-lens.svg" alt="Lens logo" /></div>
        </div>
        <div class="meta">
          <div class="name">Lens</div>
          <div class="path">ai-test-logo-lens.svg</div>
        </div>
      </section>
      <section class="card">
        <div class="sample">
          <div class="soft"><img src="./ai-test-logo-swirl.svg" alt="Swirl logo" /></div>
          <div class="white"><img src="./ai-test-logo-swirl.svg" alt="Swirl logo" /></div>
          <div class="dark"><img src="./ai-test-logo-swirl.svg" alt="Swirl logo" /></div>
        </div>
        <div class="meta">
          <div class="name">Swirl</div>
          <div class="path">ai-test-logo-swirl.svg</div>
        </div>
      </section>
      <section class="card">
        <div class="sample">
          <div class="soft"><img src="./ai-test-logo-fold.svg" alt="Fold logo" /></div>
          <div class="white"><img src="./ai-test-logo-fold.svg" alt="Fold logo" /></div>
          <div class="dark"><img src="./ai-test-logo-fold.svg" alt="Fold logo" /></div>
        </div>
        <div class="meta">
          <div class="name">Fold</div>
          <div class="path">ai-test-logo-fold.svg</div>
        </div>
      </section>
      <section class="card">
        <div class="sample">
          <div class="soft"><img src="./ai-test-logo-wave.svg" alt="Wave logo" /></div>
          <div class="white"><img src="./ai-test-logo-wave.svg" alt="Wave logo" /></div>
          <div class="dark"><img src="./ai-test-logo-wave.svg" alt="Wave logo" /></div>
        </div>
        <div class="meta">
          <div class="name">Wave</div>
          <div class="path">ai-test-logo-wave.svg</div>
        </div>
      </section>
      <section class="card">
        <div class="sample">
          <div class="soft"><img src="./ai-test-logo-comet.svg" alt="Comet logo" /></div>
          <div class="white"><img src="./ai-test-logo-comet.svg" alt="Comet logo" /></div>
          <div class="dark"><img src="./ai-test-logo-comet.svg" alt="Comet logo" /></div>
        </div>
        <div class="meta">
          <div class="name">Comet</div>
          <div class="path">ai-test-logo-comet.svg</div>
        </div>
      </section>
      <section class="card">
        <div class="sample">
          <div class="soft"><img src="./ai-test-logo-monogram.svg" alt="Monogram logo" /></div>
          <div class="white"><img src="./ai-test-logo-monogram.svg" alt="Monogram logo" /></div>
          <div class="dark"><img src="./ai-test-logo-monogram.svg" alt="Monogram logo" /></div>
        </div>
        <div class="meta">
          <div class="name">Monogram</div>
          <div class="path">ai-test-logo-monogram.svg</div>
        </div>
      </section>
    </main>
  </body>
</html>
